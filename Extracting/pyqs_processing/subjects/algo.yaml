subject: ALGO
subject_name: "Algorithms and Problem Solving"
semester: 4


course_outcomes:
  CO1: "Analyze the complexity of different algorithms using asymptotic analysis."          
  CO2: "Select an appropriate data structure and apply related operations for a given problem." 
  CO3: "Apply algorithmic principles for solving a given problem."                          
  CO4: "Identify, formulate and design an efficient solution to a given problem using appropriate data structure and algorithm design technique."

topics:
  - id: ALGO_01
    name: "Introduction: Asymptotic Analysis, Sorting/Searching Review"
    co: [CO1]
  - id: ALGO_02
    name: "Search Trees & Priority Queue (Segment/Interval/RB Tree, Binomial/Fibonacci Heap)"
    co: [CO2]
  - id: ALGO_03
    name: Divide and Conquer
    co: [CO3]
  - id: ALGO_04
    name: Greedy Algorithms
    co: [CO3]
  - id: ALGO_05
    name: Backtracking Algorithms
    co: [CO4]
  - id: ALGO_06
    name: Dynamic Programming
    co: [CO4]
  - id: ALGO_07
    name: String Algorithms
    co: [CO3]
  - id: ALGO_08
    name: "Problem Spaces and Search (BFS/DFS/A*)"
    co: [CO3]
  - id: ALGO_09
    name: "Tractable and Non-Tractable Problems (P, NP, NP-Complete)"
    co: [CO4]

