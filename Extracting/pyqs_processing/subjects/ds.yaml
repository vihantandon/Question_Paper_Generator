subject: DS
subject_name: "Data Structures"
semester: 3


course_outcomes:
  CO1: "Explain abstract data types, memory allocation schemes, and need of linear and non-linear data structures"
  CO2: "Apply and implement various linear data structures like array, linked list, stack, and queue in different problems and applications"
  CO3: "Analyse the performance of various sorting and searching techniques"
  CO4: "Demonstrate and implement various operations like search, traverse, insertion, deletion, etc. on different non-linear data structures"
  CO5: "Apply appropriate data structure to design an efficient solution for given and identified problem"


topics:
  - id: DS_01
    name: "Linear Data Structures (Array, Linked List, Stack, Queue)"
    co: [CO1, CO2]  
  - id: DS_02
    name: Searching and Sorting
    co: [CO3]
  - id: DS_03
    name: "Non-Linear DS: Multi List, Tree, Priority Queue (Heaps)"
    co: [CO1, CO4]  
  - id: DS_04
    name: "Non-Linear DS: BST, AVL, RB Tree, B/B+ Tree"
    co: [CO4]
  - id: DS_05
    name: "Non-Linear DS: Graphs"
    co: [CO5]
  - id: DS_06
    name: "Advanced DS: Segment/Interval Tree, Suffix Tree/Array, Tries"
    co: [CO5]
  - id: DS_07
    name: "Hashing (Hash Tables, Collision Resolution)"
    co: [CO5]

