subject: SDF1
subject_name: "Software Development Fundamentals - I"
semester: 1


course_outcomes:
  CO1: "Explain the logic for solving problems considering various phases of software development life cycle and depicting them using algorithm and flowcharts."
  CO2: "Explain basics of C programming concepts to make decision for solving problems."
  CO3: "Demonstrate and contrast different methods for writing modular programs in C"
  CO4: "Use various C programming constructs to implement iteration and recursion"
  CO5: "Apply and implement arrays, pointers, Structures and file handling for solving real world problems"

topics:
  - id: SDF1_01
    name: Introduction to SDLC & Problem Solving
    co: [CO1]
  - id: SDF1_02
    name: Data Types, Operators, Control Flow
    co: [CO2, CO4]  # REVIEW: CO2 = decision-making (if/else, switch); CO4 added for "iteration" (loops), taught here
  - id: SDF1_03
    name: Arrays
    co: [CO5]
  - id: SDF1_04
    name: Pointers
    co: [CO5]
  - id: SDF1_05
    name: Functions
    co: [CO3, CO4]  # REVIEW: CO3 = modular programs (functions); CO4 = recursion (a function calling itself)
  - id: SDF1_06
    name: Structures and Unions
    co: [CO5]
  - id: SDF1_07
    name: File Handling
    co: [CO5]

prerequisites:
  - topic: SDF1_03
    requires: SDF1_02
    strength: hard
  - topic: SDF1_04
    requires: SDF1_03
    strength: hard
  - topic: SDF1_04
    requires: SDF1_02
    strength: hard
  - topic: SDF1_05
    requires: SDF1_02
    strength: hard
  - topic: SDF1_06
    requires: SDF1_03
    strength: hard
  - topic: SDF1_06
    requires: SDF1_04
    strength: hard
  - topic: SDF1_07
    requires: SDF1_06
    strength: hard
  - topic: SDF1_07
    requires: SDF1_04
    strength: soft