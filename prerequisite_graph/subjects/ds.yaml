subject: DS
subject_name: "Data Structures"
semester: 3

# NOTE: DRAFT COs — replace with your official syllabus text before use.
course_outcomes:
  CO1: "Understand and implement linear data structures and basic tree/graph representations."  # C210.1 — Remember, Understand
  CO2: "Apply searching and sorting algorithms with time and space complexity analysis."          # C210.2 — Evaluate
  CO3: "Implement hashing techniques and evaluate their efficiency."                              # C210.3 — Evaluate
  CO4: "Design and apply advanced tree and heap structures for optimized data organization and retrieval."  # C210.4 — Apply
  CO5: "Use graphs, special trees, and string data structures in solving computational problems." # C210.5 — Apply

topics:
