    co: [CO4]
  - id: DS_05
    name: "Non-Linear DS: Graphs"
    co: [CO5]
  - id: DS_06
    name: "Advanced DS: Segment/Interval Tree, Suffix Tree/Array, Tries"
    co: [CO5]
  - id: DS_07
    name: "Hashing (Hash Tables, Collision Resolution)"
    co: [CO3]

