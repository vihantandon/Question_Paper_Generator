subject: SDF2
subject_name: "Software Development Fundamentals - II"
semester: 2

# NOTE: DRAFT COs — replace with your official syllabus text before use.
course_outcomes:
  CO1: "Explain various object-oriented concepts like class and objects, friend function, function and operator overloading, etc."  # official CO1
  CO2: "Apply and implement the relationships of association, aggregation, composition, and inheritance"  # official CO2
  CO3: "Apply SQL commands to create tables and perform various operations like insert, delete, select, etc."  # official CO3
  CO4: "Analyze the output of the source code and able to debug the errors"  # official CO4 — see note above, unmapped
  CO5: "Design the class diagram for real life problems and implement it using virtual functions, abstract classes, templates, and exception handling"  # official CO5


