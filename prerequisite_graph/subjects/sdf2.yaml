subject: SDF2
subject_name: "Software Development Fundamentals - II"
semester: 2

# NOTE: DRAFT COs — replace with your official syllabus text before use.
course_outcomes:
  CO1: "Explain object-oriented principles and distinguish them from procedural programming"
  CO2: "Implement classes, objects, and constructors to model real-world entities"
  CO3: "Apply inheritance and polymorphism to design extensible class hierarchies"
  CO4: "Model system relationships using UML and implement them in code"
  CO5: "Apply exception handling, templates, STL, and database fundamentals in applications"

topics:
  - id: SDF2_01
