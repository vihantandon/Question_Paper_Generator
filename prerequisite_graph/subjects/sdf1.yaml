subject: SDF1
subject_name: "Software Development Fundamentals - I"
semester: 1

# NOTE: These COs are DRAFTS written to match the topic list — they are not
# from your official syllabus. Replace the text with your university's actual
# CO statements before using this for anything that goes to faculty or
# accreditation. The topic->co mappings below should be reviewed too.
course_outcomes:
  CO1: "Explain various phases of software development life cycle"  # C109.1
  CO2: "Explain various data types, memory allocation schemes, precedence of arithmetical and logical operations, and need of array and structures"  # C109.2
  CO3: "Design the flow chart and write the high level code for different problems"  # C109.3
  CO4: "Apply and implement functions with or without pointers for different problems"  # C109.4
  CO5: "Demonstrate and implement various operations like traverse, insertion, deletion, etc. on files"  # C109.5

# COs according to 2024 PYQs
# CO1: Explain the logic for solving problems considering various phases Of
# software development life cycle and depicting them using algorithm and
# flowcharts.
# CO2: Explain basics of C programming concepts to make decision for solving
# problems.
# CO3: Demonstrate and contrast different methods for writing modular programs in C
# CO4: Use various C programming constructs to implement iteration, and
# recursion
# CO5: Apply and implement arrays, pointers, Structures and file handling for
# solving real world problems

