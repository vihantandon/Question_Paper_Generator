# Usage:
#   docker compose up -d                          # start neo4j + chroma + redis
#   docker compose --profile tools run --rm loader          # load subject YAMLs into Neo4j
#   docker compose --profile tools run --rm loader --reset  # wipe Topic/CO nodes, then reload
#                                                           # (use after removing/renaming anything in a YAML)
#
# Every port is published on 127.0.0.1 only: the databases can be reached
# from this machine, not from the rest of the network. Chroma and Redis have
# no password and Neo4j's default one is public, so before removing a
# "127.0.0.1:" prefix, set real passwords.

services:
  neo4j:
    image: neo4j:5
    container_name: neo4j_server
    ports:
      - "127.0.0.1:7474:7474"   # browser UI
      - "127.0.0.1:7687:7687"   # bolt protocol (Python driver connects here)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-yourpassword}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  chroma:
    # Pinned: ":latest" can move to a release that the installed Python client
    # or the data in ./chroma_data does not match. Upgrade on purpose, and
    # keep the major version (1.x) the same as chromadb in requirements.txt.
    image: chromadb/chroma:1.5.9
    container_name: chromadb_server
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./chroma_data:/data
    restart: unless-stopped

  cache:
    image: redis:7
    container_name: redis_cache
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # One-off job: loads subjects/*.yaml into Neo4j, then exits.
  # Excluded from `docker compose up` by the "tools" profile.
  loader:
    build: ./prerequisite_graph/loader
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-yourpassword}
    volumes:
      - ./prerequisite_graph/subjects:/app/subjects:ro
    profiles: ["tools"]

  # Commented out until there's an actual app to containerize
  # (there is no Dockerfile at the repo root yet, so this service
  # would fail the build). Scripts currently run on the host.
  #
  # app:
  #   build: .
  #   depends_on:
  #     neo4j:
  #       condition: service_healthy
  #   environment:
  #     - NEO4J_URI=bolt://neo4j:7687
  #     - NEO4J_USER=neo4j
  #     - NEO4J_PASSWORD=${NEO4J_PASSWORD:-yourpassword}
  #     - CHROMA_HOST=chroma
  #     - REDIS_HOST=cache

volumes:
  neo4j_data:
  redis_data:
  # NOTE: chroma_data is a bind mount (./chroma_data), not a named volume,
  # so your existing embedded vectors on disk are picked up as-is.